<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Musibox</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
        <script>
            try {
                const t = localStorage.getItem('musicbox:theme');
                if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            } catch {}
        </script>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <header class="top">
            <div class="logo">
                Musibox
                <p style="font-size: 0.8em; margin: 0; color: black;"></p>
            </div>
            <div id="buttons">
                <button id="theme">Night/Day mode</button>
                <button id="account">Account</button>
            </div>
        </header>
        <main class="grid">
            <input
                id="plName"
                class="pl-name"
                value="My playlist"
                aria-label="Playlist name"
                maxlength="40"
            >
            <div id="panels">
                <section class="panel">
                    <input
                        id="q"
                        class="search"
                        type="search"
                        placeholder="Search songs or artists"
                        autocomplete="off"
                    >
                    <h2 id="findTitle">Trending now</h2>
                    <ul id="results" class="tracks"></ul>
                </section>
                <section class="panel">
                    <div class="head">
                        <h2>
                            Your playlist
                            <span id="count" class="count">0</span>
                        </h2>
                        <div class="menu-wrap">
                            <button id="exportBtn" class="ghost" disabled>Export</button>
                            <div id="exportMenu" hidden>
                                <button class="menu-item" data-act="share">Share link…</button>
                                <button class="menu-item" data-act="text">Copy as text</button>
                                <button class="menu-item" data-act="csv">Download CSV</button>
                            </div>
                        </div>
                    </div>
                    <ul id="playlist" class="tracks"></ul>
                    <p id="empty" class="empty">Add a song from the left to start your playlist.</p>
                    <div id="sugSlot" hidden>
                        <div id="sugBox">
                            <div class="head">
                                <h2>Suggested for you</h2>
                                <button id="newRecsBtn" class="ghost" type="button">New recommendations</button>
                            </div>
                            <ul id="suggestions" class="tracks"></ul>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <div id="accountdiv">
            <h1>Account</h1>
            <p>Account management is not available yet.</p>
            <button id="closeAccount">Close</button>
        </div>
        <div id="shareModal" class="modal" hidden>
            <div
                class="modal-card"
                role="dialog"
                aria-modal="true"
                aria-labelledby="shareTitle"
            >
                <h2 id="shareTitle">Share this playlist</h2>
                <div id="shareStep1">
                    <form id="shareForm">
                        <label class="field">
                            How long should the link work?
                            <select id="shareExpiry">
                                <option value="1h">1 hour</option>
                                <option value="1d">1 day</option>
                                <option value="7d" selected>7 days</option>
                                <option value="30d">30 days</option>
                                <option value="never">Forever</option>
                            </select>
                        </label>
                        <label class="check">
                            <input type="checkbox" id="sharePwOn"> Protect with a password
                        </label>
                        <div id="sharePwRow" hidden>
                            <input
                                id="sharePw"
                                type="password"
                                placeholder="Choose a password (4+ characters)"
                                maxlength="64"
                                autocomplete="new-password"
                            >
                        </div>
                        <p id="shareError" class="form-error" role="alert"></p>
                        <div class="modal-actions">
                            <button type="button" id="shareCancel" class="ghost">Cancel</button>
                            <button type="submit" id="shareSubmit" class="primary">Create link</button>
                        </div>
                    </form>
                </div>
                <div id="shareStep2" hidden>
                    <div class="link-row">
                        <input id="shareLink" readonly aria-label="Share link">
                        <button id="shareCopy" class="primary" type="button">Copy</button>
                    </div>
                    <p id="shareInfo" class="muted"></p>
                    <div class="modal-actions">
                        <button id="shareDone" class="ghost" type="button">Done</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="unlockModal" class="modal" hidden>
            <div
                class="modal-card"
                role="dialog"
                aria-modal="true"
                aria-labelledby="unlockTitle"
            >
                <h2 id="unlockTitle">This playlist is protected</h2>
                <form id="unlockForm">
                    <input
                        id="unlockPw"
                        type="password"
                        placeholder="Enter the password"
                        maxlength="64"
                        autocomplete="off"
                    >
                    <p id="unlockError" class="form-error" role="alert"></p>
                    <div class="modal-actions">
                        <button type="button" id="unlockCancel" class="ghost">Cancel</button>
                        <button type="submit" class="primary">Open</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="toast" role="status"></div>
        <script src="/app.js"></script>
    </body>
</html>
